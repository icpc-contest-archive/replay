	function render(f) {
		var disp = '<table class=\"scoreboard\"><colgroup><col id="scorerank" /><col id="scoreaffil" /><col id="scoreteamname" /></colgroup><colgroup><col id="scoresolv" /><col id="scoretotal" /></colgroup><colgroup><col class="scoreprob" /><col class="scoreprob" /><col class="scoreprob" /><col class="scoreprob" /><col class="scoreprob" /><col class="scoreprob" /><col class="scoreprob" /><col class="scoreprob" /><col class="scoreprob" /><col class="scoreprob" /></colgroup><thead><tr class="scoreheader"><th title="rank" scope="col">#</th><th title="team affiliation" scope="col">affil.</th><th title="team name" scope="col">team</th><th title="# solved / penalty time" colspan="2" scope="col">score</th><th title="problem Sunday Drive" scope="col">A <img style="background-color: LightPink;" alt="problem colour LightPink" src="images/circle.png" /></th><th title="problem Hexagram" scope="col">B <img style="background-color: SkyBlue;" alt="problem colour SkyBlue" src="images/circle.png" /></th><th title="problem Flooring Tiles" scope="col">C <img style="background-color: Green;" alt="problem colour Green" src="images/circle.png" /></th><th title="problem Vive la Difference" scope="col">D <img style="background-color: Red;" alt="problem colour Red" src="images/circle.png" /></th><th title="problem Robot Navigaion" scope="col">E <img style="background-color: Yellow;" alt="problem colour Yellow" src="images/circle.png" /></th><th title="problem Folding Game" scope="col">F <img style="background-color: Orange;" alt="problem colour Orange" src="images/circle.png" /></th><th title="problem Burnout" scope="col">G <img style="background-color: #C031C7;" alt="problem colour #C031C7" src="images/circle.png" /></th><th title="problem Family Fortune" scope="col">H <img style="background-color: Crimson;" alt="problem colour Crimson" src="images/circle.png" /></th><th title="problem Moving Points" scope="col">I <img style="background-color: Blue;" alt="problem colour Blue" src="images/circle.png" /></th><th title="problem Vampire Numbers" scope="col">J <img style="background-color: Lime;" alt="problem colour Lime" src="images/circle.png" /></th></tr></thead>';

		for(x in f) {
			var data = f[x];
			var nsolved = 0;
			var totaltime = 0;
			for (prob in probs){
				if (prob in data) {
					if (data[prob].solved) {
						totaltime += data[prob].time + data[prob].penalty;
						nsolved++;
					} else {
						data[prob].numattempts=0;
						for(attempt in data[prob].attempts) if (data[prob].attempts[attempt] <= curtime) {data[prob].numattempts++;data[prob].attempttime=data[prob].attempts[attempt];}
					}
				}
			}
			
			tinfo = tnames[data['team']];
			if (tinfo.category == 4) continue;// Skip the unused/judges category
			disp += '<tr><td class="scorep1">' + x + '</td><td class="scoreaf"><img src="images/affiliations/'+tinfo['affilid']+'.png" alt="'+tinfo['affilid']+'" title="'+tinfo['affilname']+'" /><img src="images/countries/'+tinfo['country']+'.png" alt="'+tinfo['country']+'" title="'+tinfo['country']+'" /></td><td class="scoretn" style="background: '+tinfo['color']+'">'+tnames[data['team']]['name']+'</td><td class="scorenc">'+nsolved+'</td><td class="scorett">'+totaltime+'</td>';
			for(prob in probs) {
				if (prob in data) {
					if (data[prob].solved)             disp+= '<td class="score_correct">'+data[prob].num_submissions +' (' + data[prob].time + ' + ' + data[prob].penalty + ')</td>';
					else if(data[prob].numattempts>0)  disp+= '<td class="score_incorrect">'+data[prob].numattempts +' (' + data[prob].attempttime + ')</td>';
					else disp += '<td class="score_neutral">0</td>';
				}
				else { disp += '<td class="score_neutral">0</td>';}
			}
			disp += '</tr>';
		}
		$('#scoreboard').html(disp);
	}
	function teamcmp(a, b) {
		var alen = 0;
		var blen = 0;
		for (prob in probs) {
			if ((prob in a) && a[prob].solved) alen++;
			if ((prob in b) && b[prob].solved) blen++;
		}
		
		if (alen > blen) return -1;
		if (alen < blen) return 1;
		
		// they solved the same number of problems, compare their total times
		atotal = 0; btotal =0;
		for (prob in a) {
			if (prob in probs && a[prob].solved) atotal += a[prob].time + a[prob].penalty;
		}
		for (prob in b) {
			if (prob in probs && b[prob].solved) btotal += b[prob].time + b[prob].penalty;
		}
		
		// Lower time is better
		if (atotal > btotal) return 1;
		if (atotal < btotal) return -1;
		
		// Identical, who cares
		return 0;
	}
	function filter(time) {
		// Copy result matrix
		var filtered = new Array();
		var i=0;
		for(team in data) {
			if (!(team in tnames)) continue;
			filtered[i] = new Array();
			filtered[i]['team'] = team;
			for (prob in data[team]) {
				if (data[team][prob].time <= time) {
					filtered[i][prob] = data[team][prob];
					filtered[i][prob].solved = true;
					filtered[i][prob].numattempts=0;
					filtered[i][prob].attempttime=0;
					continue;
				}
				
				// check the attempts to see if they are less than the time
				for (attempt in data[team][prob].attempts) {
					if (attempt <= time) {
						filtered[i][prob] = data[team][prob];
						filtered[i][prob].solved = false;
						filtered[i][prob].numattempts=0;
						filtered[i][prob].attempttime=0;
					}
				}
			}			
			i++;
		}
		filtered = filtered.sort(teamcmp);
		//console.log(filtered)
		return filtered;
	}
	var endtime = 60*5; // Length of a contest
	var step = 5; // How many minutes to step by each time
	var curtime = endtime;
	function replayContest() {
		curtime = 0;
		setTimeout('replayHelper()',200);
	}
	function replayHelper() {
		$('#contestTime').val(curtime);
		$('#slider').slider({value: curtime});
	
		f = filter(curtime);
		render(f);
		
		curtime+=step;

		if (curtime <= endtime)
			setTimeout('replayHelper()',300);
	}
	
	$().ready(function(){
		render(filter(curtime));
		$('#contestTime').val(curtime);
		var slide = $('#slider');
		slide.slider({
			value: curtime,
			max:endtime,
			min:0,
			step: step,
			change: function(e, ui) { if(e.originalEvent==undefined)return; $('#contestTime').val(ui.value); updateCurTime();}
		});
	});
	
	
	// Customization stuff
	function updateCurTime() {
		curtime = $('#contestTime').val();
		if (curtime < 0) {curtime = 0; $('#contestTime').val(curtime);}
		if (curtime > endtime) {curtime=endtime; $('#contestTime').val(curtime);}
		
		f = filter(curtime);
		render(f);
	}
	</script>
