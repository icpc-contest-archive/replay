    <script data-ref="ignore">
        window.__INITIAL_STATE__ = JSON.parse("{\"intl\":{\"locale\":\"en_US\",\"messages\":{\"SITE_CONFIG_aboutPageHtml\":\"\u0026lt;div id\u0026#61;\u0026#34;lipsum\u0026#34;\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;The Oviatt Library Digital Collections feature historically significant documents, photographs, oral histories, artistic works and exhibit materials selected from the Oviatt Special Collections and Archives. Additional project contributors include local heritage organizations, neighboring academic institutions and private collectors. The scope of these collections is focused in the area of Los Angeles with emphasis on the San Fernando Valley. Other collections include digital reproductions of documents from the Civil War, Slavery and it\u0026amp;apos;s aftermath,\u00A0 Chinese antiquities, and photographs from our \u0026lt;em\u0026gt;Old China Hands Archives\u0026lt;\/em\u0026gt; that document the experiences of foreign residents of China in 1946. \u0026lt;br \/\u0026gt;\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;Our \u0026lt;em\u0026gt;International Guitar Research Archives\u0026lt;\/em\u0026gt; (IGRA) feature extensive collections of guitar works and correspondence that lend insight into the development of this unique music culture. Collections drawn from the \u0026lt;em\u0026gt;University Archives\u0026lt;\/em\u0026gt; reveal some of the rich history of the California State University Northridge. Virtual exhibits capture the essence of past exhibitions held at the Library Gallery. \u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;The Oviatt Library Digital Collections are selected from archival and heritage collections under contexts defined by digital collections organizers. These do not necessarily represent nor do they replace the entire contents and contexts embodied within the corpus of collections from which they are derived. Because of this, researchers are strongly encouraged to extend their inquiries into the collections of the \u0026lt;a href\u0026#61;\u0026#34;http:\/\/library.csun.edu\/SCA\u0026#34;\u0026gt;Oviatt Library Special Collections and Archives\u0026lt;\/a\u0026gt; as well as those held by participating institutions as indicated within the information attached to these digital objects. Information regarding the repository, source collection, and finding aid are provided for this purpose. \u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;\u0026lt;strong\u0026gt;Copyright. \u0026lt;\/strong\u0026gt;The items in our Digital Collections are made available for educational purposes. Commercial use of works that are not in the public domain is strictly prohibited by law without prior written consent from the copyright holder(s). The responsibility for the use of these materials rests exclusively with the user.\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;We look forward to learning more about our digital holdings, and to hearing from any copyright owners who may not be properly identified. If you have any additional information about our collections, or if you would like to suggest a correction, please contact the \u0026lt;a href\u0026#61;\u0026#34;http:\/\/library.csun.edu\/contact\u0026#34;\u0026gt;Library Webmaster\u0026lt;\/a\u0026gt;.\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;\/div\u0026gt;\",\"SITE_CONFIG_aboutPageTitle\":\"About the Digital Collections\",\"SITE_CONFIG_breadcrumbTopLevelText\":\"Home\",\"SITE_CONFIG_customHomePageAltText\":\"\",\"SITE_CONFIG_downloadExtraLargeEnabled\":\"Extra Large\",\"SITE_CONFIG_downloadFullResEnabled\":\"Full-size archival image\",\"SITE_CONFIG_downloadFullSizeEnabled\":\"Full-size\",\"SITE_CONFIG_downloadLargeEnabled\":\"Large\",\"SITE_CONFIG_downloadMediumEnabled\":\"Medium\",\"SITE_CONFIG_downloadSmallEnabled\":\"Small\",\"SITE_CONFIG_globalHomePageHtml\":\"\u0026amp;lt;div id\u0026#61;\u0026amp;quot;lipsum\u0026amp;quot;\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;text-align: justify;\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;span style\u0026#61;\u0026amp;quot;font-size: small;\u0026amp;quot;\u0026amp;gt;The Oviatt Library Digital Collections feature historically significant documents, photographs, oral histories, artistic works and exhibit materials selected from the Oviatt Special Collections and Archives. Additional project contributors include local heritage organizations, neighboring academic institutions and private collectors. The majority of these collections focus on Los Angeles history with emphasis on the San Fernando Valley. Other collections include digital reproductions of documents from the Civil War, Slavery and it\u0026amp;apos;s aftermath,\u00A0 Chinese antiquities, and photographs from our \u0026amp;lt;em\u0026amp;gt;Old China Hands Archives\u0026amp;lt;\/em\u0026amp;gt; that document the experiences of foreign residents of China in 1946. The \u0026amp;lt;em\u0026amp;gt;CSU Japanese American Digitization Project \u0026amp;lt;\/em\u0026amp;gt;brings together diverse World War II documents from across fifteen campuses of the California State University system. \u0026amp;lt;br \/\u0026amp;gt;\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;text-align: justify;\u0026amp;quot;\u0026amp;gt;\u0026amp;lt 026amp;lt;\/p\u0026amp;gt;\",\"suggestedTopics\":[],\"browseButtonEnabled\":true,\"browseButtonText\":\"Browse\",\"suggestedTopicsEnabled\":true,\"landingPageImage\":null,\"landingPageImagePreferences\":\"noImage\",\"header\":{\"overrideHeaderGlobal\":false,\"hideHeaderText\":false,\"logo\":{\"useOptional\":false,\"url\":\"\",\"text\":\"SITE_CONFIG_siteName\",\"hyperlink\":null,\"altText\":\"SITE_CONFIG_siteName\"},\"navmenu\":null},\"siteHeader\":\"customhtml\",\"enableMetadataHyperlinking\":true,\"enablePrintButton\":false,\"enableDownloadButton\":true,\"social\":{\"shareEnabled\":false,\"overrideSocialLinksGlobal\":false,\"id\":null},\"downloadImageConfiguration\":{\"downloadSmallEnabled\":false,\"downloadMediumEnabled\":false,\"downloadLargeEnabled\":false,\"downloadExtraLargeEnabled\":false,\"downloadFullSizeEnabled\":true,\"downloadFullResEnabled\":false},\"customFiles\":{\"customCssFilePath\":null,\"customJsFilePath\":null},\"enableArchivalDownload\":false,\"customURL\":\"https:\/\/digital-library.csun.edu\/sundial\",\"customUrlEnabled\":true,\"version\":\"14\",\"overrideDownloadGlobal\":false,\"customLandingPageEnabled\":false,\"customLandingPage\":\"\",\"messages\":{\"SITE_CONFIG_aboutPageHtml\":\"\u0026lt;div id\u0026#61;\u0026#34;lipsum\u0026#34;\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;The Oviatt Library Digital Collections feature historically significant documents, photographs, oral histories, artistic works and exhibit materials selected from the Oviatt Special Collections and Archives. Additional project contributors include local heritage organizations, neighboring academic institutions and private collectors. The scope of these collections is focused in the area of Los Angeles with emphasis on the San Fernando Valley. Other collections include digital reproductions of documents from the Civil War, Slavery and it\u0026amp;apos;s aftermath,\u00A0 Chinese antiquities, and photographs from our \u0026lt;em\u0026gt;Old China Hands Archives\u0026lt;\/em\u0026gt; that document the experiences of foreign residents of China in 1946. \u0026lt;br \/\u0026gt;\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;Our \u0026lt;em\u0026gt;International Guitar Research Archives\u0026lt;\/em\u0026gt; (IGRA) feature extensive collections of guitar works and correspondence that lend insight into the development of this unique music culture. Collections drawn from the \u0026lt;em\u0026gt;University Archives\u0026lt;\/em\u0026gt; reveal some of the rich history of the California State University Northridge. Virtual exhibits capture the essence of past exhibitions held at the Library Gallery. \u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;The Oviatt Library Digital Collections are selected from archival and heritage collections under contexts defined by digital collections organizers. These do not necessarily represent nor do they replace the entire contents and contexts embodied within the corpus of collections from which they are derived. Because of this, researchers are strongly encouraged to extend their inquiries into the collections of the \u0026lt;a href\u0026#61;\u0026#34;http:\/\/library.csun.edu\/SCA\u0026#34;\u0026gt;Oviatt Library Special Collections and Archives\u0026lt;\/a\u0026gt; as well as those held by participating institutions as indicated within the information attached to these digital objects. Information regarding the repository, source collection, and finding aid are provided for this purpose. \u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;\u0026lt;strong\u0026gt;Copyright. \u0026lt;\/strong\u0026gt;The items in our Digital Collections are made available for educational purposes. Commercial use of works that are not in the public domain is strictly prohibited by law without prior written consent from the copyright holder(s). The responsibility for the use of these materials rests exclusively with the user.\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;We look forward to learning more about our digital holdings, and to hearing from any copyright owners who may not be properly identified. If you have any additional information about our collections, or if you would like to suggest a correction, please contact the \u0026lt;a href\u0026#61;\u0026#34;http:\/\/library.csun.edu\/contact\u0026#34;\u0026gt;Library Webmaster\u0026lt;\/a\u0026gt;.\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;\/div\u0026gt;\",\"SITE_CONFIG_aboutPageTitle\":\"About the Digital Collections\",\"SITE_CONFIG_breadcrumbTopLevelText\":\"Home\",\"SITE_CONFIG_browseButtonText\":\"Browse\",\"SITE_CONFIG_customHomePageAltText\":\"\",\"SITE_CONFIG_customLandingPage\":\"\",\"SITE_CONFIG_customLandingPageAltText\":\"The Daily Sundial\",\"SITE_CONFIG_downloadExtraLargeEnabled\":\"Extra Large\",\"SITE_CONFIG_downloadFullResEnabled\":\"Full-size archival image\",\"SITE_CONFIG_downloadFullSizeEnabled\":\"Full-size\",\"SITE_CONFIG_downloadLargeEnabled\":\"Large\",\"SITE_CONFIG_downloadMediumEnabled\":\"Medium\",\"SITE_CONFIG_downloadSmallEnabled\":\"Small\",\"SITE_CONFIG_globalHomePageHtml\":\"\u0026amp;lt;div id\u0026#61;\u0026amp;quot;lipsum\u0026amp;quot;\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;text-align: justify;\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;span style\u0026#61;\u0026amp;quot;font-size: small;\u0026amp;quot;\u0026amp;gt;The Oviatt Library Digital Collections feature historically significant documents, photographs, oral histories, artistic works and exhibit materials selected from the Oviatt Special Collections and Archives. Additional project contributors include local heritage organizations, neighboring academic institutions and private collectors. The majority of these collections focus on Los Angeles history with emphasis on the San Fernando Valley. Other collections include digital reproductions of documents from the Civil War, Slavery and it\u0026amp;apos;s aftermath,\u00A0 Chinese antiquities, and photographs from our \u0026amp;lt;em\u0026amp;gt;Old China Hands Archives\u0026amp;lt;\/em\u0026amp;gt; that document the experiences of foreign residents of China in 1946. The \u0026amp;lt;em\u0026amp;gt;CSU Japanese American Digitization Project \u0026amp;lt;\/em\u0026amp;gt;brings together diverse World War II documents from across fifteen campuses of the California State University system. \u0026amp;lt;br \/\u0026amp;gt;\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;text-align: justify;\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;span style\u0026#61;\u0026amp;quot;font-size: small;\u0026amp;quot;\u0026amp;gt;Our \u0026amp;lt;em\u0026amp;gt;International Guitar Research Archives\u0026amp;lt;\/em\u0026amp;gt; (IGRA) feature extensive collections of guitar compositions, recording notes and correspondence that lend insight into the development of this unique music culture. Collections drawn from the \u0026amp;lt;em\u0026amp;gt;University Archives\u0026amp;lt;\/em\u0026amp;gt; reveal some of the rich history of the California State University Northridge. Virtual exhibits capture the essence of past exhibitions held at the Library Gallery. \u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p style\u0026#61;\u0026amp;quot;text-align: justify;\u0026a have any additional information about our collections, or if you would like to suggest a correction, please contact the \u0026amp;lt;a href\u0026#61;\u0026amp;quot;http:\/\/library.csun.edu\/library-webmaster\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Library Webmaster\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;\/div\u0026amp;gt;\",\"SITE_CONFIG_homePageHtml\":\"\u0026lt;div id\u0026#61;\u0026#34;lipsum\u0026#34;\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;The Oviatt Library Digital Collections feature historically significant documents, photographs, oral histories, artistic works and exhibit materials selected from the Oviatt Special Collections and Archives. Additional project contributors include local heritage organizations, neighboring academic institutions and private collectors. The majority of these collections focus on Los Angeles history with emphasis on the San Fernando Valley. Other collections include digital reproductions of documents from the Civil War, Slavery and it\u0026amp;apos;s aftermath,\u00A0 Chinese antiquities, and photographs from our \u0026lt;em\u0026gt;Old China Hands Archives\u0026lt;\/em\u0026gt; that document the experiences of foreign residents of China in 1946. The \u0026lt;em\u0026gt;CSU Japanese American Digitization Project \u0026lt;\/em\u0026gt;brings together diverse World War II documents from across fifteen campuses of the California State University system. \u0026lt;br \/\u0026gt;\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;Our \u0026lt;em\u0026gt;International Guitar Research Archives\u0026lt;\/em\u0026gt; (IGRA) feature extensive collections of guitar compositions, recording notes and correspondence that lend insight into the development of this unique music culture. Collections drawn from the \u0026lt;em\u0026gt;University Archives\u0026lt;\/em\u0026gt; reveal some of the rich history of the California State University Northridge. Virtual exhibits capture the essence of past exhibitions held at the Library Gallery. \u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;The Oviatt Library Digital Collections are selected from archival and heritage collections under contexts defined by digital collections organizers. These do not necessarily represent nor do they replace the entire contents and contexts embodied within the corpus of collections from which they are derived. Because of this, researchers are strongly encouraged to extend their inquiries into the collections of the \u0026lt;a href\u0026#61;\u0026#34;http:\/\/library.csun.edu\/SCA\u0026#34;\u0026gt;Oviatt Library Special Collections and Archives\u0026lt;\/a\u0026gt; as well as those held by participating institutions as indicated within the information attached to these digital objects. Information regarding the repository, source collection, and finding aid are provided for this purpose.\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;font-size: small;\u0026#34;\u0026gt;\u0026lt;strong\u0026gt;Copyright. \u0026lt;\/strong\u0026gt;The items in our Digital Collections are made available for educational purposes. Commercial use of works that are not in the public domain is strictly prohibited by law without prior written consent from the copyright holder(s). The responsibility for the use of these materials rests exclusively with the user. \u0026lt;br \/\u0026gt;\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u
