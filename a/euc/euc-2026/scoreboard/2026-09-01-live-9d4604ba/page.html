    /* please don't judge. */
      :root {
        --resultCellWidth: 95%;
        --WAcolor: 220, 53, 69;
        --WAdrop: 139, 35, 45;
        --REcolor: 0, 123, 255;
        --REdrop: 7, 69, 136;
        --CEcolor: 195, 194, 196;
        --CEdrop: 112, 112, 112;
        --MLEcolor: 189, 97, 27;
        --MLEdrop: 121, 65, 21;
        --OLEcolor: 52, 58, 64;
        --OLEdrop: 41, 46, 51;
      }
      .contestant__img {
        background-image: radial-gradient(
          circle at center bottom,
          #15ab9f,
          #000
        );
      }
      .result-cell__first-solve-badge {
        left: -3px;
        top: -3px;
      }
      .result-cell__bombs {
        right: -2px;
        top: -2px;
      }
      .result-cell--header {
        flex-direction: row;
        align-items: center;
        justify-content: space-evenly;
        padding-left: 6px;
      }
      .result-cell__solves {
        background-color: rgb(96, 217, 211);
        width: 2rem;
        height: 1.3rem;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-bottom: 1px;
        font-weight: 600;
        text-shadow:
          -1px 0px 2px #000,
          1px 0px 2px #000;
      }
      .rtb .contestant {
        display: none;
      }
      .rtb .totals {
        display: none;
      }
      .rtb .grid3 {
        grid-template-columns: 1fr;
      }
      .rtb .result-cell--header {
        width: 100% !important;
      }
      .rts .grid3 {
        grid-template-columns: minmax(16rem, auto) 10rem;
        grid-template-rows: auto auto;
        grid-auto-flow: row;
      }
      .rts .results {
        grid-column: span 2;
      }
      .contestant__team {
        display: block !important;
      }
    </style>
