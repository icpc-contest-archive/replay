  <!-- Splash Screen | Appears during application initialization proccess -->
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #splash-screen {
      position: absolute;
      z-index: 1000;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background-color: #f2f3f8;
    }

    #splash-screen img {
      margin-left: calc(100vw - 100%);
      margin-bottom: 30px;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .splash-spinner {
      animation: rotate 2s linear infinite;
      margin-left: calc(100vw - 100%);
      width: 50px;
      height: 50px;
    }
